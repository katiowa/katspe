name: mapeditor
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.3.0
  device_preview_plus: ^2.9.5
  file_picker: ^13.1.0
  flat_buffers: ^25.9.23
  flutter:
    sdk: flutter
  lua_dardo_plus: ^0.3.1
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "engine/logo/icon-mapeditor.webp"

flutter:
  uses-material-design: true
  assets:
    - engine/logo/
    - engine/languages/
    - engine/languages/flags/
    - engine/converters/map-editor/
    - lib/plugins/packages/dashboard/plugin.json